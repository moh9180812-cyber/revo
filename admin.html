<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الطلبات | ريڤو</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .atabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.atabs button{background:#fff;color:#7c3aed;border:1px solid #7c3aed}.atabs button.on{background:#7c3aed;color:#fff}
    .thumb{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#f3f0ff}
    .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}.p-ok{background:#dcfce7;color:#166534}.p-low{background:#ffedd5;color:#c2410c}.p-out{background:#fee2e2;color:#b91c1c}.p-off{background:#e5e7eb;color:#555}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:560px){.grid2{grid-template-columns:1fr}}
    #pm,#label-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}#pm.hidden{display:none}
    #pm .modal-box{width:560px;max-width:100%}.warnbox{background:#ffedd5;color:#9a3412;padding:8px 12px;border-radius:8px;margin-bottom:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    #label-modal.hidden{display:none}
    .modal-box{background:#fff;border-radius:10px;padding:14px;max-height:96vh;overflow:auto}
    .label-card{width:380px;max-width:100%;border:2px dashed #222;padding:16px;background:#fff;color:#000;font-size:16px;line-height:1.7}
    .label-card h2{margin:0 0 8px;font-size:20px;border-bottom:2px solid #000;padding-bottom:6px}
    .label-card .row{margin:4px 0}.label-card .big{font-size:22px;font-weight:700}
    .label-card .cod{margin-top:10px;border:2px solid #000;padding:8px;text-align:center;font-size:20px;font-weight:700}
    @media print{body *{visibility:hidden}#label-card,#label-card *{visibility:visible}#label-card{position:absolute;inset:0 auto auto 0}}
  </style>
</head>
<body>
  <header><h1 id="admin-title">لوحة الطلبات</h1><span><button class="small hidden" id="logout-admin">تسجيل خروج</button> <a href="index.html" style="color:#fff">المتجر</a></span></header>
  <div class="wrap">
    <form id="login" class="hidden">
      <label>الإيميل <input name="email" type="email" required></label>
      <label>الباسورد <input name="password" type="password" required></label>
      <p><button>دخول</button></p>
      <div id="login-err"></div>
    </form>
    <div id="panel" class="hidden">
    <div class="atabs"><button id="t-orders" class="on">📦 الطلبات</button><button id="t-products">🛍️ المنتجات</button><button id="t-coupons">🏷️ الكوبونات</button></div>
    <div id="tab-orders">
      <p class="actions"><button id="xlsx">⬇️ تصدير Excel (.xlsx)</button> <button id="csv">تصدير CSV (اختياري)</button> <span id="count"></span> <span id="msg" style="color:#b00"></span></p>
      <table><thead><tr><th>التاريخ</th><th>الاسم</th><th>الموبايل</th><th>المدينة</th><th>العنوان</th><th>المنتجات</th><th>الإجمالي</th><th>الحالة</th><th>بوليصة</th></tr></thead>
      <tbody id="rows"></tbody></table>
    </div>
    <div id="tab-products" class="hidden">
      <div id="stock-warn"></div>
      <p class="actions"><button id="p-add">➕ إضافة منتج</button> <span id="p-count"></span> <span id="p-msg" style="color:#b00"></span></p>
      <table><thead><tr><th>صورة</th><th>الاسم</th><th>القسم</th><th>السعر</th><th>قبل الخصم</th><th>المخزون</th><th>الحالة</th><th></th></tr></thead><tbody id="p-rows"></tbody></table>
    </div>
    <div id="tab-coupons" class="hidden">
      <form id="c-form" class="grid2">
        <label>الكود <input name="code" required placeholder="مثال: WELCOME10" style="text-transform:uppercase"></label>
        <label>النوع <select name="kind"><option value="percent">نسبة %</option><option value="fixed">مبلغ ثابت</option></select></label>
        <label>القيمة <input name="value" type="number" min="1" step="any" required></label>
        <label>أقل إجمالي للطلب (اختياري) <input name="min_total" type="number" min="0" step="any" value="0"></label>
        <label>ينتهي يوم (اختياري) <input name="expires" type="date"></label>
        <label>أقصى عدد استخدامات (اختياري) <input name="max_uses" type="number" min="1" step="1"></label>
        <p><button>➕ إضافة كوبون</button> <span id="c-msg" style="color:#b00"></span></p>
      </form>
      <table><thead><tr><th>الكود</th><th>الخصم</th><th>أقل طلب</th><th>ينتهي</th><th>استخدام</th><th>الحالة</th><th></th></tr></thead><tbody id="c-rows"></tbody></table>
    </div>
    </div>
  </div>
  <div id="pm" class="hidden"><div class="modal-box">
    <h3 id="pm-title">منتج</h3>
    <form id="p-form" class="grid2">
      <label>الاسم <input name="name" required></label>
      <label>القسم <input name="category" required list="cats" placeholder="ملابس / مستحضرات تجميل"><datalist id="cats"></datalist></label>
      <label>السعر <input name="price" type="number" min="0" step="any" required></label>
      <label>السعر قبل الخصم (0 = من غير خصم) <input name="old_price" type="number" min="0" step="any" value="0"></label>
      <label>المخزون (عدد القطع) <input name="stock" type="number" min="0" step="1" value="0" required></label>
      <label>شارة اختيارية (مثال: جديد) <input name="badge"></label>
      <label style="grid-column:1/-1">الوصف <textarea name="description" rows="2"></textarea></label>
      <label>إيموجي بديل <input name="emoji" value="🛍️"></label>
      <label>رابط الصورة <input name="image" type="url" placeholder="https://..."></label>
      <label style="grid-column:1/-1">أو ارفع صورة من جهازك <input id="p-file" type="file" accept="image/*"></label>
      <div style="grid-column:1/-1"><img id="p-prev" class="thumb" style="width:96px;height:96px" alt=""></div>
      <label style="grid-column:1/-1"><input name="active" type="checkbox" checked style="width:auto"> ظاهر في المتجر</label>
      <p style="grid-column:1/-1"><button id="p-save">حفظ</button> <button type="button" class="small" id="p-cancel">إلغاء</button> <span id="pf-msg" style="color:#b00"></span></p>
    </form>
  </div></div>
  <div id="label-modal" class="hidden"><div class="modal-box">
    <div id="label-card" class="label-card"></div>
    <p class="actions"><button id="lbl-print">🖨️ طباعة</button> <button id="lbl-img">🖼️ حفظ كصورة</button> <button id="lbl-close">إغلاق</button></p>
  </div></div>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="admin.js"></script>
</body>
</html>
