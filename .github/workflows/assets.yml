# بيحوّل ملفات الصور المحفوظة كنص (assets/*.b64) لصور حقيقية في الريبو (لوجو ريڤو وأيقونات التطبيق).
name: Build image assets
on:
  push:
    paths: ["assets/**", ".github/workflows/assets.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode images
        run: |
          for f in assets/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "$n"; done
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Build image assets"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 5; done
